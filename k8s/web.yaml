kind: Deployment
apiVersion: apps/v1
metadata:
  name: web
  namespace: demo
  # annotations:
  #   argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
      - name: web
        image: nginx:1.27
